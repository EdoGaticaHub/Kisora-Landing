name: CodeQL
on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
permissions:
  contents: read
  security-events: write
jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript,python
      - uses: github/codeql-action/analyze@v4
